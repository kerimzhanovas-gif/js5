<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение Авторизация и Функция sumAll</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Задание 1: Авторизация -->
        <div class="card">
            <h2>🌸 Авторизация</h2>
            <p class="subtitle">Введите логин и пароль</p>

            <form id="authForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="loginInput">Логин:</label>
                    <input type="text" id="loginInput" placeholder="Введите логин">
                </div>

                <div class="form-group">
                    <label for="passwordInput">Пароль:</label>
                    <input type="password" id="passwordInput" placeholder="Введите пароль">
                </div>

                <button type="button" id="loginBtn" class="btn">Войти</button>
            </form>

            <div id="authMessage" class="message"></div>
        </div>

        <!-- Задание 2: Функция sumAll -->
        <div class="card">
            <h2>✨ Функция sumAll</h2>
            <p class="subtitle">Подсчет суммы любого количества чисел</p>

            <div class="form-group">
                <label for="numbersInput">Числа:</label>
                <input type="text" id="numbersInput" value="2, 5, 6, 7" placeholder="Например: 1, 2, 3">
            </div>

            <button type="button" id="calcBtn" class="btn">Посчитать сумму</button>

            <div class="result-box">
                <span>Результат: </span>
                <strong id="sumResult">20</strong>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
